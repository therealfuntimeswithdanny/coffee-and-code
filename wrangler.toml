name = "coffeencode"
main = "src/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Import HTML email templates and Markdown docs as text.
rules = [
  { type = "Text", globs = ["**/*.html", "**/*.md"], fallthrough = false },
]

[assets]
directory = "media"
binding = "ASSETS"

[observability]
enabled = true

[observability.logs]
enabled = true

[vars]
PUB_NAME = "Coffee and Code"
PUB_DESCRIPTION = "A small tech news publication built on the AT Protocol by Daniel Morrisey"
OWNER_DID = "did:plc:l37td5yhxl2irrzrgvei4qay"
OWNER_PDS = "https://account.coffeencode.cc"
STORAGE_PUBLIC_URL = "https://storage.coffeencode.cc"
VAPID_SUBJECT = "mailto:atcdn@danielmorrisey.com"
VAPID_PUBLIC_KEY = "BFYP88Ohzh6ob5Qxpp8wsdvN94PTO8QsmOKRH1kgRkjSieEA0vX7nCQl177HIf7VN5mMglT8SXgcNP-b5yg4gUw"
GOOGLE_CLIENT_ID = "1089638521565-c43jh0bake2q329tfq5obr5k62o3bu37.apps.googleusercontent.com"
# GitHub OAuth signup. Create a GitHub OAuth app with callback URL
# https://coffeencode.cc/auth/github/callback, put its public client ID here,
# and configure the secret with: wrangler secret put GITHUB_CLIENT_SECRET
GITHUB_CLIENT_ID = "Ov23li9CkdWFxve0Pn24"
CF_ZONE_ID = "cb5bf50fe19cd974cd6f0340e619273e"

# Push notification state.
[[kv_namespaces]]
binding = "PUSH_TOKENS"
id = "69ad42d54b0f4304b4d0acf5a1e184d3"

# Author-uploaded media, served through storage.coffeencode.cc.
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "coffeencode-storage"

# Poll notification feeds and send push/email digests.
[triggers]
crons = ["*/5 * * * *"]

# Cloudflare Email Sending for verification and digest mail.
[[send_email]]
name = "EMAIL"
