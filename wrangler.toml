name = "coffeencode"
main = "src/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# HTML email templates under cloudflare/email/templates are imported as text.
# Markdown docs under docs/ are imported as text for the /docs pages.
rules = [
  { type = "Text", globs = ["**/*.html", "**/*.md"], fallthrough = false },
]

[assets]
directory = "media"
binding = "ASSETS"

[observability]
enabled = true

[observability.logs]
enabled = true

[vars]
PUB_NAME = "Coffee and Code"
PUB_DESCRIPTION = "A small tech news publication built on the AT Protocol by Daniel Morrisey"
OWNER_DID = "did:plc:l37td5yhxl2irrzrgvei4qay"
OWNER_PDS = "https://account.coffeencode.cc"
STORAGE_PUBLIC_URL = "https://storage.coffeencode.cc"
# Browser push notifications (Web Push / VAPID). Generate a key pair, put the
# public key here, and set the private key with:
#   wrangler secret put VAPID_PRIVATE_KEY
# VAPID_SUBJECT is a contact URI required by push services.
VAPID_SUBJECT = "mailto:atcdn@danielmorrisey.com"
VAPID_PUBLIC_KEY = "BFYP88Ohzh6ob5Qxpp8wsdvN94PTO8QsmOKRH1kgRkjSieEA0vX7nCQl177HIf7VN5mMglT8SXgcNP-b5yg4gUw"
# Google Identity Services web client ID for /auth Google signup. Create an
# OAuth web client in Google Cloud, add https://coffeencode.cc as an authorized
# JavaScript origin, then set the public client ID here.
GOOGLE_CLIENT_ID = "391308630027-37eo8j55bp85un4cf4djhm7dmketblgp.apps.googleusercontent.com"
# Optional: purge the story URL from the Cloudflare zone cache when a post is
# updated. Uncomment and set the API token with:
#   wrangler secret put CF_API_TOKEN
# CF_ZONE_ID = "<zone id>"

# Stores Expo push tokens (device:<token>) and per-account push state
# (state:<did>). To isolate `wrangler dev` from production data, create a
# preview namespace with: wrangler kv:namespace create PUSH_TOKENS --preview
# and add it here as: preview_id = "..."
[[kv_namespaces]]
binding = "PUSH_TOKENS"
id = "69ad42d54b0f4304b4d0acf5a1e184d3"

# Author-uploaded videos, served publicly at
# https://storage.coffeencode.cc/video/<did>/<cid>.<ext> through the bucket's
# custom domain. Create with: wrangler r2 bucket create coffeencode-storage
# then attach the storage.coffeencode.cc custom domain in the dashboard.
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "coffeencode-storage"

# Polls registered accounts' notification feeds, pushes new items, and emails
# digests to opted-in subscribers.
[triggers]
crons = ["*/5 * * * *"]

# Cloudflare Email Sending binding used for verification and digest mail.
# The from address domain (coffeencode.cc) must be enabled for Email Sending
# in the Cloudflare dashboard for sends to succeed.
[[send_email]]
name = "EMAIL"
